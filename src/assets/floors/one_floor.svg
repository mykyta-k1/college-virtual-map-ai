<svg width="1658" height="421" viewBox="0 0 1658 421" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Шаблон: Сходи -->
    <g id="stairs-icon">
      <path d="M0 0H40V80H0V0Z" fill="white" stroke="#3E2723" stroke-width="2"/>
      <path d="M0 10H40M0 20H40M0 30H40M0 40H40M0 50H40M0 60H40M0 70H40" stroke="#3E2723" stroke-width="2"/>
    </g>
    <!-- Шаблон: Знак Вихід (Exit) -->
    <g id="exit-sign">
      <rect width="36" height="18" fill="#2E7D32" />
      <text x="18" y="13" font-family="Arial" font-size="10" fill="white" text-anchor="middle" font-weight="bold">EXIT</text>
      <path d="M28 4L32 9L28 14" stroke="white" stroke-width="1.5" fill="none"/>
      <path d="M22 9H32" stroke="white" stroke-width="1.5" fill="none"/>
    </g>
    <!-- Шаблон: Вогнегасник (Extinguisher) -->
    <g id="fire-ext">
      <rect width="16" height="20" fill="#C62828" rx="2"/>
      <path d="M5 6V2H11V6" stroke="white" stroke-width="2"/>
      <path d="M8 6V18" stroke="white" stroke-width="2"/>
    </g>
    <!-- Шаблон: Телефон (Phone) -->
    <g id="phone-sign">
       <circle cx="12" cy="12" r="12" fill="#2E7D32"/>
       <path d="M7 10C7 10 8 16 14 17" stroke="white" stroke-width="2" fill="none"/>
       <rect x="6" y="8" width="4" height="4" fill="white"/>
       <rect x="14" y="16" width="4" height="4" fill="white"/>
    </g>
    <!-- Шаблон: Електрика (Hazard) -->
    <g id="hazard-sign">
      <path d="M0 18L10 0L20 18H0Z" fill="#FDD835" stroke="black" stroke-width="1"/>
      <path d="M11 4L7 10H10L8 15" stroke="black" stroke-width="1.5" fill="none"/>
    </g>
     <!-- Шаблон: Медицина (Med) -->
    <g id="med-sign">
       <rect width="20" height="20" fill="white" stroke="#C62828"/>
       <path d="M10 4V16M4 10H16" stroke="#C62828" stroke-width="3"/>
    </g>
    <!-- Шаблон: Гідрант (PK - Blue Circle) -->
    <g id="hydrant-sign">
        <circle cx="10" cy="10" r="10" fill="#1565C0"/>
        <text x="10" y="13" font-family="Arial" font-size="8" fill="white" text-anchor="middle">ПК</text>
    </g>
    <!-- Шаблон: Круглий номер (Room Circle) -->
    <g id="room-circle">
        <circle cx="28" cy="28" r="26" fill="white" stroke="black" stroke-width="2"/>
    </g>
  </defs>

  <rect width="1658" height="421" fill="white"/>

  <!-- ================= СТІНИ (Walls) ================= -->
  <!-- Зовнішній контур -->
  <rect x="2.5" y="2.5" width="1653" height="416" stroke="#3E2723" stroke-width="5" fill="none"/>
  
  <!-- Коридор (горизонтальні лінії) -->
  <line x1="2.5" y1="144" x2="1655.5" y2="144" stroke="#3E2723" stroke-width="5"/>
  <line x1="2.5" y1="260" x2="1655.5" y2="260" stroke="#3E2723" stroke-width="5"/>

  <!-- Вертикальні перегородки (ВЕРХ) -->
  <!-- 301 | 303 --> <line x1="280" y1="2.5" x2="280" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- 303 | Stairs --> <line x1="420" y1="2.5" x2="420" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- Stairs | 305 --> <line x1="480" y1="2.5" x2="480" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- 305 | 307 --> <line x1="680" y1="2.5" x2="680" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- 307 | 309 --> <line x1="900" y1="2.5" x2="900" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- 309 | Stairs --> <line x1="1160" y1="2.5" x2="1160" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- Stairs | WC --> <line x1="1220" y1="2.5" x2="1220" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- WC | WC --> <line x1="1300" y1="2.5" x2="1300" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- WC | Kitchen --> <line x1="1390" y1="2.5" x2="1390" y2="144" stroke="#3E2723" stroke-width="5"/>
  <!-- Kitchen | Cafe Hall --> <line x1="1470" y1="2.5" x2="1470" y2="144" stroke="#3E2723" stroke-width="5"/>

  <!-- Вертикальні перегородки (НИЗ) -->
  <!-- 300 | 302 --> <line x1="280" y1="260" x2="280" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- 302 | 304 --> <line x1="480" y1="260" x2="480" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- 304 | FireNiche --> <line x1="710" y1="260" x2="710" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- FireNiche (internal) -->
     <line x1="710" y1="330" x2="770" y2="330" stroke="#3E2723" stroke-width="5"/>
     <line x1="770" y1="330" x2="770" y2="418.5" stroke="#3E2723" stroke-width="5"/>
     <line x1="770" y1="330" x2="820" y2="330" stroke="#3E2723" stroke-width="5"/> <!-- Corridor wall gap -->
     <line x1="820" y1="330" x2="820" y2="370" stroke="#3E2723" stroke-width="5"/> <!-- phone nook -->
  <!-- 308 Left Wall --> <line x1="880" y1="260" x2="880" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- 308 | 310 --> <line x1="1080" y1="260" x2="1080" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- 310 | HALL --> <line x1="1180" y1="260" x2="1180" y2="418.5" stroke="#3E2723" stroke-width="5"/>
  <!-- HALL | CAFE --> <line x1="1470" y1="260" x2="1470" y2="418.5" stroke="#3E2723" stroke-width="5"/>

  <!-- ================= ДВЕРІ (Doors - White gaps + Lines) ================= -->
  
  <!-- Верхні двері -->
  <g stroke="#3E2723" stroke-width="2">
    <!-- 301 --> <line x1="70" y1="144" x2="100" y2="120" /> <path d="M70 144 H110" stroke="white" stroke-width="6"/> 
    <!-- 303 --> <line x1="330" y1="144" x2="360" y2="120" /> <path d="M330 144 H370" stroke="white" stroke-width="6"/>
    <!-- 305 --> <line x1="530" y1="144" x2="560" y2="120" /> <path d="M530 144 H570" stroke="white" stroke-width="6"/>
    <!-- 307 --> <line x1="730" y1="144" x2="760" y2="120" /> <path d="M730 144 H770" stroke="white" stroke-width="6"/>
    <!-- 309 --> <line x1="950" y1="144" x2="980" y2="120" /> <path d="M950 144 H990" stroke="white" stroke-width="6"/>
    <!-- WC1 --> <line x1="1270" y1="144" x2="1290" y2="125" /> <path d="M1270 144 H1295" stroke="white" stroke-width="6"/>
    <!-- WC2 --> <line x1="1350" y1="144" x2="1370" y2="125" /> <path d="M1350 144 H1375" stroke="white" stroke-width="6"/>
    <!-- Kitchen --> <line x1="1430" y1="144" x2="1450" y2="125" /> <path d="M1430 144 H1455" stroke="white" stroke-width="6"/>
    <!-- Cafe Hall (Diagonal entrance) --> <line x1="1500" y1="40" x2="1530" y2="70" /> <path d="M1490 20 L1500 40" stroke="white" stroke-width="6"/>
    <!-- Cafe Hall from corridor --> <line x1="1540" y1="144" x2="1570" y2="120" /> <path d="M1540 144 H1580" stroke="white" stroke-width="6"/>
  </g>

  <!-- Нижні двері -->
  <g stroke="#3E2723" stroke-width="2">
    <!-- 300 --> <line x1="170" y1="260" x2="200" y2="284" /> <path d="M170 260 H210" stroke="white" stroke-width="6"/>
    <!-- 302 --> <line x1="330" y1="260" x2="360" y2="284" /> <path d="M330 260 H370" stroke="white" stroke-width="6"/>
    <!-- 304 --> <line x1="650" y1="260" x2="680" y2="284" /> <path d="M650 260 H690" stroke="white" stroke-width="6"/>
    <!-- 308 --> <line x1="1130" y1="260" x2="1160" y2="284" /> <path d="M1130 260 H1170" stroke="white" stroke-width="6"/>
    <!-- 310 --> <line x1="1260" y1="260" x2="1280" y2="245" /> <path d="M1250 260 H1290" stroke="white" stroke-width="6"/> <!-- Angle fix -->
    <!-- Hall (ЗАЛ) --> <line x1="1430" y1="260" x2="1450" y2="284" /> <path d="M1420 260 H1460" stroke="white" stroke-width="6"/>
    <!-- Cafe (КАФЕ) --> <line x1="1530" y1="260" x2="1560" y2="284" /> <path d="M1530 260 H1570" stroke="white" stroke-width="6"/>
     <!-- Fire Niche Door (small) --> <line x1="1080" y1="300" x2="1110" y2="280" /> <path d="M1080 300 V320" stroke="white" stroke-width="6"/> <!-- Inside corridor? Actually diagram shows opening -->
  </g>
  
  <!-- Відкритий прохід в кінці коридору праворуч -->
  <line x1="1600" y1="220" x2="1630" y2="190" stroke="#3E2723" stroke-width="2" />
  <line x1="1600" y1="240" x2="1630" y2="270" stroke="#3E2723" stroke-width="2" />

  <!-- ================= ДЕТАЛІ ТА МЕБЛІ ================= -->
  
  <!-- Сходи (Ліва) -->
  <use href="#stairs-icon" x="425" y="30" />
  <use href="#stairs-icon" x="460" y="30" transform="scale(-1, 1) translate(-920, 0)" /> <!-- Mirrored -->
  
  <!-- Сходи (Права) -->
  <use href="#stairs-icon" x="1165" y="30" />
  <use href="#stairs-icon" x="1200" y="30" transform="scale(-1, 1) translate(-2400, 0)" /> 

  <!-- Зелена лінія евакуації в коридорі -->
  <path d="M150 202 H460 M480 202 H1150 M1170 202 H1470" stroke="#1B5E20" stroke-width="6" stroke-linecap="round"/>

  <!-- ================= ІКОНКИ ================= -->
  
  <!-- Вихід (Exit) -->
  <use href="#exit-sign" x="425" y="15" />
  <use href="#exit-sign" x="1165" y="15" />
  <use href="#exit-sign" x="1580" y="195" /> <!-- Right end -->
  <use href="#exit-sign" x="780" y="390" /> <!-- Bottom Niche -->

  <!-- Вогнегасники -->
  <use href="#fire-ext" x="10" y="190" /> <!-- Far Left -->
  <use href="#fire-ext" x="730" y="340" /> <!-- Bottom Niche -->
  <use href="#fire-ext" x="1500" y="120" /> <!-- Cafe Hall Entrance -->

  <!-- Електрика -->
  <use href="#hazard-sign" x="300" y="135" />
  <use href="#hazard-sign" x="1080" y="135" />

  <!-- Медицина -->
  <use href="#med-sign" x="290" y="105" />

  <!-- Гідрант (ПК) -->
  <use href="#hydrant-sign" x="470" y="130" />
  <use href="#hydrant-sign" x="1150" y="130" />
  
  <!-- Телефон -->
  <use href="#phone-sign" x="750" y="370" />

  <!-- ================= ТЕКСТ / КІМНАТИ ================= -->
  
  <g font-family="Arial" font-size="20" font-weight="bold" text-anchor="middle" fill="black">
      <!-- 301 --> <use href="#room-circle" x="105" y="50" /> <text x="133" y="85">301</text>
      <!-- 303 --> <use href="#room-circle" x="300" y="50" /> <text x="328" y="85">303</text>
      <!-- 305 --> <use href="#room-circle" x="520" y="50" /> <text x="548" y="85">305</text>
      <!-- 307 --> <use href="#room-circle" x="740" y="50" /> <text x="768" y="85">307</text>
      <!-- 309 --> <use href="#room-circle" x="990" y="50" /> <text x="1018" y="85">309</text>
      
      <!-- WC Top --> 
      <use href="#room-circle" x="1235" y="50" transform="scale(0.9) translate(137,5)" /> <text x="1263" y="85">WC</text>
      <use href="#room-circle" x="1325" y="50" transform="scale(0.9) translate(147,5)" /> <text x="1353" y="85">WC</text>
      
      <!-- Kitchen -->
      <use href="#room-circle" x="1415" y="50" transform="scale(0.9) translate(157,5)" /> <text x="1443" y="82" font-size="14">кухня</text>

      <!-- Cafe Hall Top -->
      <text x="1560" y="60">КАФЕ</text>
      <text x="1560" y="85">ЗАЛ</text>

      <!-- Bottom Row -->
      <!-- 300 --> <use href="#room-circle" x="105" y="290" /> <text x="133" y="325">300</text>
      <!-- 302 --> <use href="#room-circle" x="330" y="290" /> <text x="358" y="325">302</text>
      <!-- 304 --> <use href="#room-circle" x="550" y="290" /> <text x="578" y="325">304</text>
      
      <!-- 308 --> <use href="#room-circle" x="990" y="290" /> <text x="1018" y="325">308</text>
      
      <!-- 310 --> <use href="#room-circle" x="1200" y="290" transform="scale(0.9) translate(133,32)" /> <text x="1228" y="325">310</text>

      <!-- Hall Bottom -->
      <text x="1370" y="325">ЗАЛ</text>
      
      <!-- Cafe Bottom -->
      <text x="1560" y="325">КАФЕ</text>
  </g>
  
  <!-- Чорний блок у коридорі (стійка/перегородка) біля 308 -->
  <rect x="760" y="250" width="100" height="20" fill="#1A1A1A" />
  <line x1="760" y1="255" x2="860" y2="255" stroke="gray" stroke-width="2"/>
  <line x1="760" y1="260" x2="860" y2="260" stroke="gray" stroke-width="2"/>
  <line x1="760" y1="265" x2="860" y2="265" stroke="gray" stroke-width="2"/>

</svg>