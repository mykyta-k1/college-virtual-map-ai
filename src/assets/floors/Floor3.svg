<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <marker id="arrowhead-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-up" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <polygon points="0 8, 3 0, 6 8" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 3 8, 6 0" fill="#4a90d9" opacity="0.6"/>
    </marker>
  </defs>

  <!-- ЗОВНІШНІ СТІНИ -->
  <g id="walls">
    <rect x="20" y="30" width="1560" height="440" rx="2"
          stroke="#333" stroke-width="3" fill="none"/>
    <line x1="20" y1="200" x2="1580" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="20" y1="300" x2="1580" y2="300" stroke="#333" stroke-width="2"/>
  </g>

  <!-- КОРИДОР -->
  <g id="corridor">
    <rect x="20" y="200" width="1560" height="100" fill="#f0f4f8" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- ВЕРХНІЙ РЯД                                   -->
  <!-- 333, 335, [сходи], 337(+кімн), 339(+2кімн), 341, 343(комора), 345(+2кімн), [сходи], 347(+2кімн), 349(2входи) -->
  <!-- ============================================ -->
  <g id="rooms">
    <!-- 333 -->
    <g id="room-333" data-room="333" class="room">
      <rect x="20" y="30" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 335 -->
    <g id="room-335" data-room="335" class="room">
      <rect x="160" y="30" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Сходи (ліві) -->
    <g id="stairs-top-left" data-type="stairs" class="stairs">
      <rect x="300" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <line x1="310" y1="60" x2="390" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="80" x2="390" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="100" x2="390" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="120" x2="390" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="140" x2="390" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="160" x2="390" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- 337 (перехід з кімнатою) -->
    <g id="room-337" data-room="337" class="room">
      <rect x="400" y="30" width="150" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <line x1="490" y1="30" x2="490" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="483" y1="110" x2="497" y2="110" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 339 (два переходи з кімнатою) -->
    <g id="room-339" data-room="339" class="room">
      <rect x="550" y="30" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Перша перегородка -->
      <line x1="620" y1="30" x2="620" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="613" y1="100" x2="627" y2="100" stroke="#4CAF50" stroke-width="3"/>
      <!-- Друга перегородка -->
      <line x1="680" y1="30" x2="680" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="673" y1="100" x2="687" y2="100" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 341 -->
    <g id="room-341" data-room="341" class="room">
      <rect x="730" y="30" width="120" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 343 (невелика комора) -->
    <g id="room-343" data-room="343" data-type="closet" class="room">
      <rect x="850" y="30" width="60" height="170" fill="#f0e6d0" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 345 (два переходи кімнати) -->
    <g id="room-345" data-room="345" class="room">
      <rect x="910" y="30" width="170" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <line x1="975" y1="30" x2="975" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="968" y1="100" x2="982" y2="100" stroke="#4CAF50" stroke-width="3"/>
      <line x1="1035" y1="30" x2="1035" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1028" y1="100" x2="1042" y2="100" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- Сходи (праві) -->
    <g id="stairs-top-right" data-type="stairs" class="stairs">
      <rect x="1080" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <line x1="1090" y1="60" x2="1170" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="1090" y1="80" x2="1170" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="1090" y1="100" x2="1170" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="1090" y1="120" x2="1170" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="1090" y1="140" x2="1170" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="1090" y1="160" x2="1170" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- 347 (два переходи кімнат) -->
    <g id="room-347" data-room="347" class="room">
      <rect x="1180" y="30" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <line x1="1260" y1="30" x2="1260" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1253" y1="110" x2="1267" y2="110" stroke="#4CAF50" stroke-width="3"/>
      <line x1="1320" y1="30" x2="1320" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1313" y1="110" x2="1327" y2="110" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 349 (два входи) -->
    <g id="room-349" data-room="349" class="room">
      <rect x="1360" y="30" width="220" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- ============================================ -->
    <!-- НИЖНІЙ РЯД                                   -->
    <!-- 326(+кімн→328), 328(+з326+внутр), 330, 332(+кімн), 334(+кімн), 336, -->
    <!-- 338(2входи+2переходи), 340(+кімн→342), 342(+перехід+2входи) -->
    <!-- ============================================ -->

    <!-- 326 (перехід між кімнатою та з кімнати у 328) -->
    <g id="room-326" data-room="326" class="room">
      <rect x="20" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня кімната -->
      <line x1="130" y1="300" x2="130" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="123" y1="390" x2="137" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>
    <!-- Дверний проїзд між 326 і 328 (в нижній стіні між ними) -->

    <!-- 328 (перехід з 326 + внутрішній перехід кімнати) -->
    <g id="room-328" data-room="328" class="room">
      <rect x="200" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="310" y1="300" x2="310" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="303" y1="390" x2="317" y2="390" stroke="#4CAF50" stroke-width="3"/>
      <!-- Прохід з 326 -->
      <line x1="200" y1="360" x2="200" y2="400" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 330 -->
    <g id="room-330" data-room="330" class="room">
      <rect x="380" y="300" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 332 (перехід з кімнатою) -->
    <g id="room-332" data-room="332" class="room">
      <rect x="520" y="300" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <line x1="610" y1="300" x2="610" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="603" y1="390" x2="617" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 334 (перехід з кімнатою) -->
    <g id="room-334" data-room="334" class="room">
      <rect x="680" y="300" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <line x1="770" y1="300" x2="770" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="763" y1="390" x2="777" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 336 -->
    <g id="room-336" data-room="336" class="room">
      <rect x="840" y="300" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 338 (два входи та два переходи між кімнатами) -->
    <g id="room-338" data-room="338" class="room">
      <rect x="980" y="300" width="200" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Перша перегородка -->
      <line x1="1060" y1="300" x2="1060" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1053" y1="380" x2="1067" y2="380" stroke="#4CAF50" stroke-width="3"/>
      <!-- Друга перегородка -->
      <line x1="1130" y1="300" x2="1130" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1123" y1="380" x2="1137" y2="380" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 340 (перехід між кімнатою + перехід у 342) -->
    <g id="room-340" data-room="340" class="room">
      <rect x="1180" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="1280" y1="300" x2="1280" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <line x1="1273" y1="390" x2="1287" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 342 (перехід з 340, сполучає 2 входи/виходи) -->
    <g id="room-342" data-room="342" class="room">
      <rect x="1360" y="300" width="220" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Прохід між 340 і 342 -->
      <line x1="1360" y1="360" x2="1360" y2="400" stroke="#4CAF50" stroke-width="3"/>
    </g>
  </g>

  <!-- ДВЕРНІ ПРОЇЗДИ -->
  <g id="doors">
    <!-- Верхній ряд -->
    <line x1="70" y1="195" x2="110" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="200" y1="195" x2="240" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="430" y1="195" x2="470" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="570" y1="195" x2="610" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="770" y1="195" x2="810" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="860" y1="195" x2="890" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="940" y1="195" x2="980" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1220" y1="195" x2="1260" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- 349: два входи -->
    <line x1="1400" y1="195" x2="1440" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1510" y1="195" x2="1550" y2="195" stroke="#f0f4f8" stroke-width="6"/>

    <!-- Нижній ряд -->
    <line x1="60" y1="305" x2="100" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="240" y1="305" x2="280" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="420" y1="305" x2="460" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="560" y1="305" x2="600" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="720" y1="305" x2="760" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="880" y1="305" x2="920" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- 338: два входи -->
    <line x1="1000" y1="305" x2="1040" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1140" y1="305" x2="1170" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1220" y1="305" x2="1260" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- 342: два входи -->
    <line x1="1400" y1="305" x2="1440" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1520" y1="305" x2="1560" y2="305" stroke="#f0f4f8" stroke-width="6"/>
  </g>

  <!-- СТРІЛКИ НАВІГАЦІЇ -->
  <g id="arrows">
    <!-- Горизонтальні сегменти -->
    <path id="arrow-seg-1" data-segment="1" d="M 40,250 L 200,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-2" data-segment="2" d="M 220,250 L 340,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-3" data-segment="3" d="M 360,250 L 540,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-4" data-segment="4" d="M 560,250 L 720,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-5" data-segment="5" d="M 740,250 L 850,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-6" data-segment="6" d="M 870,250 L 1070,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-7" data-segment="7" d="M 1090,250 L 1350,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-8" data-segment="8" d="M 1370,250 L 1560,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>

    <!-- Вертикальні відгалуження (верхній ряд) -->
    <path id="arrow-to-333" data-target="333" d="M 90,245 L 90,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-335" data-target="335" d="M 220,245 L 220,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-337" data-target="337" d="M 450,245 L 450,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-339" data-target="339" d="M 590,245 L 590,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-341" data-target="341" d="M 790,245 L 790,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-343" data-target="343" d="M 875,245 L 875,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-345" data-target="345" d="M 960,245 L 960,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-347" data-target="347" d="M 1240,245 L 1240,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-349" data-target="349" d="M 1470,245 L 1470,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>

    <!-- Вертикальні відгалуження (нижній ряд) -->
    <path id="arrow-to-326" data-target="326" d="M 80,255 L 80,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-328" data-target="328" d="M 260,255 L 260,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-330" data-target="330" d="M 440,255 L 440,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-332" data-target="332" d="M 580,255 L 580,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-334" data-target="334" d="M 740,255 L 740,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-336" data-target="336" d="M 900,255 L 900,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-338" data-target="338" d="M 1020,255 L 1020,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-340" data-target="340" d="M 1240,255 L 1240,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-342" data-target="342" d="M 1470,255 L 1470,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
  </g>
</svg>
