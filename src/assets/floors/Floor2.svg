<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <marker id="arrowhead-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-up" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <polygon points="0 8, 3 0, 6 8" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 3 8, 6 0" fill="#4a90d9" opacity="0.6"/>
    </marker>
  </defs>

  <!-- ============================================ -->
  <!-- ЗОВНІШНІ СТІНИ                               -->
  <!-- ============================================ -->
  <g id="walls">
    <rect x="20" y="30" width="1560" height="440" rx="2"
          stroke="#333" stroke-width="3" fill="none"/>
    <line x1="20" y1="200" x2="1580" y2="200" stroke="#333" stroke-width="2"/>
    <line x1="20" y1="300" x2="1580" y2="300" stroke="#333" stroke-width="2"/>
  </g>

  <!-- КОРИДОР -->
  <g id="corridor">
    <rect x="20" y="200" width="1560" height="100" fill="#f0f4f8" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- КІМНАТИ — ВЕРХНІЙ РЯД                        -->
  <!-- Порядок: 319, 321, [сходи], 323, 325(+кімн), 327(+кімн), [сходи], 329, 331 -->
  <!-- ============================================ -->
  <g id="rooms">
    <!-- 319 -->
    <g id="room-319" data-room="319" class="room">
      <rect x="20" y="30" width="150" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 321 -->
    <g id="room-321" data-room="321" class="room">
      <rect x="170" y="30" width="150" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Сходи (ліві) -->
    <g id="stairs-top-left" data-type="stairs" class="stairs">
      <rect x="320" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <line x1="330" y1="60" x2="410" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="330" y1="80" x2="410" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="330" y1="100" x2="410" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="330" y1="120" x2="410" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="330" y1="140" x2="410" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="330" y1="160" x2="410" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- 323 -->
    <g id="room-323" data-room="323" class="room">
      <rect x="420" y="30" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 325 (з сполученням з кімнатою) -->
    <g id="room-325" data-room="325" class="room">
      <rect x="580" y="30" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="700" y1="30" x2="700" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Дверний проїзд між кімнатами -->
      <line x1="693" y1="110" x2="707" y2="110" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 327 (з сполученням з кімнатою) -->
    <g id="room-327" data-room="327" class="room">
      <rect x="760" y="30" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="870" y1="30" x2="870" y2="200" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Дверний проїзд -->
      <line x1="863" y1="110" x2="877" y2="110" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- Сходи (праві) -->
    <g id="stairs-top-right" data-type="stairs" class="stairs">
      <rect x="940" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <line x1="950" y1="60" x2="1030" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="950" y1="80" x2="1030" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="950" y1="100" x2="1030" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="950" y1="120" x2="1030" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="950" y1="140" x2="1030" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="950" y1="160" x2="1030" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- 329 -->
    <g id="room-329" data-room="329" class="room">
      <rect x="1040" y="30" width="250" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 331 -->
    <g id="room-331" data-room="331" class="room">
      <rect x="1290" y="30" width="290" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- ============================================ -->
    <!-- КІМНАТИ — НИЖНІЙ РЯД                        -->
    <!-- Порядок: 312, 314, 316(+кімн), 318, 320(+кімн), 322, 324 -->
    <!-- ============================================ -->

    <!-- 312 -->
    <g id="room-312" data-room="312" class="room">
      <rect x="20" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 314 -->
    <g id="room-314" data-room="314" class="room">
      <rect x="200" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 316 (з сполученням з кімнатою) -->
    <g id="room-316" data-room="316" class="room">
      <rect x="380" y="300" width="200" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="510" y1="300" x2="510" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Дверний проїзд -->
      <line x1="503" y1="390" x2="517" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 318 -->
    <g id="room-318" data-room="318" class="room">
      <rect x="580" y="300" width="180" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 320 (з сполученням з кімнатою) -->
    <g id="room-320" data-room="320" class="room">
      <rect x="760" y="300" width="200" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка -->
      <line x1="890" y1="300" x2="890" y2="470" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Дверний проїзд -->
      <line x1="883" y1="390" x2="897" y2="390" stroke="#4CAF50" stroke-width="3"/>
    </g>

    <!-- 322 -->
    <g id="room-322" data-room="322" class="room">
      <rect x="960" y="300" width="200" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 324 -->
    <g id="room-324" data-room="324" class="room">
      <rect x="1160" y="300" width="420" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- ДВЕРНІ ПРОЇЗДИ                                -->
  <!-- ============================================ -->
  <g id="doors">
    <!-- Верхній ряд -->
    <line x1="80" y1="195" x2="120" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="220" y1="195" x2="260" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="470" y1="195" x2="510" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="620" y1="195" x2="660" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="800" y1="195" x2="840" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1120" y1="195" x2="1160" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1380" y1="195" x2="1420" y2="195" stroke="#f0f4f8" stroke-width="6"/>

    <!-- Нижній ряд -->
    <line x1="80" y1="305" x2="120" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="260" y1="305" x2="300" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="430" y1="305" x2="470" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="640" y1="305" x2="680" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="810" y1="305" x2="850" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1020" y1="305" x2="1060" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <line x1="1300" y1="305" x2="1340" y2="305" stroke="#f0f4f8" stroke-width="6"/>
  </g>

  <!-- ============================================ -->
  <!-- СТРІЛКИ НАВІГАЦІЇ В КОРИДОРІ                  -->
  <!-- ============================================ -->
  <g id="arrows">
    <!-- Горизонтальні сегменти -->
    <path id="arrow-seg-1" data-segment="1" d="M 40,250 L 220,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-2" data-segment="2" d="M 240,250 L 360,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-3" data-segment="3" d="M 380,250 L 560,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-4" data-segment="4" d="M 580,250 L 740,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-5" data-segment="5" d="M 760,250 L 930,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-6" data-segment="6" d="M 950,250 L 1150,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>
    <path id="arrow-seg-7" data-segment="7" d="M 1170,250 L 1560,250" stroke="#4a90d9" stroke-width="2" opacity="0.5" marker-end="url(#arrowhead-right)"/>

    <!-- Вертикальні відгалуження (верхній ряд) -->
    <path id="arrow-to-319" data-target="319" d="M 95,245 L 95,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-321" data-target="321" d="M 245,245 L 245,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-323" data-target="323" d="M 490,245 L 490,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-325" data-target="325" d="M 650,245 L 650,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-327" data-target="327" d="M 830,245 L 830,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-329" data-target="329" d="M 1150,245 L 1150,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-331" data-target="331" d="M 1400,245 L 1400,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>

    <!-- Вертикальні відгалуження (нижній ряд) -->
    <path id="arrow-to-312" data-target="312" d="M 100,255 L 100,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-314" data-target="314" d="M 280,255 L 280,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-316" data-target="316" d="M 460,255 L 460,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-318" data-target="318" d="M 660,255 L 660,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-320" data-target="320" d="M 840,255 L 840,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-322" data-target="322" d="M 1050,255 L 1050,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-324" data-target="324" d="M 1320,255 L 1320,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
  </g>
</svg>
