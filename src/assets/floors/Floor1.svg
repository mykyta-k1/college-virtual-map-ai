<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 500" fill="none">
  <defs>
    <!-- Стиль для стрілок навігації -->
    <marker id="arrowhead-right" markerWidth="8" markerHeight="6" refX="8" refY="3" orient="auto">
      <polygon points="0 0, 8 3, 0 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-left" markerWidth="8" markerHeight="6" refX="0" refY="3" orient="auto">
      <polygon points="8 0, 0 3, 8 6" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-up" markerWidth="6" markerHeight="8" refX="3" refY="0" orient="auto">
      <polygon points="0 8, 3 0, 6 8" fill="#4a90d9" opacity="0.6"/>
    </marker>
    <marker id="arrowhead-down" markerWidth="6" markerHeight="8" refX="3" refY="8" orient="auto">
      <polygon points="0 0, 3 8, 6 0" fill="#4a90d9" opacity="0.6"/>
    </marker>
  </defs>

  <!-- ============================================ -->
  <!-- ЗОВНІШНІ СТІНИ БУДІВЛІ                      -->
  <!-- ============================================ -->
  <g id="walls">
    <rect x="20" y="30" width="1560" height="440" rx="2" 
          stroke="#333" stroke-width="3" fill="none"/>
    <!-- Горизонтальна стіна верхнього ряду (відділяє кімнати від коридору) -->
    <line x1="20" y1="200" x2="1580" y2="200" stroke="#333" stroke-width="2"/>
    <!-- Горизонтальна стіна нижнього ряду (відділяє коридор від кімнат) -->
    <line x1="20" y1="300" x2="1580" y2="300" stroke="#333" stroke-width="2"/>
  </g>

  <!-- ============================================ -->
  <!-- КОРИДОР (центральна смуга)                   -->
  <!-- ============================================ -->
  <g id="corridor">
    <rect x="20" y="200" width="1560" height="100" fill="#f0f4f8" opacity="0.5"/>
  </g>

  <!-- ============================================ -->
  <!-- КІМНАТИ — ВЕРХНІЙ РЯД (зверху вниз: стіна → кімната → коридор) -->
  <!-- Порядок (L→R): 301, 303, [сходи], 305, 307, 309, [сходи], WC(ч), WC(ж), Зал кафе+кухня -->
  <!-- ============================================ -->
  <g id="rooms">
    <!-- 301 -->
    <g id="room-301" data-room="301" class="room">
      <rect x="20" y="30" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 303 -->
    <g id="room-303" data-room="303" class="room">
      <rect x="160" y="30" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Сходи (ліві) -->
    <g id="stairs-top-left" data-type="stairs" class="stairs">
      <rect x="300" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <!-- Сходові лінії -->
      <line x1="310" y1="60" x2="390" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="80" x2="390" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="100" x2="390" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="120" x2="390" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="140" x2="390" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="310" y1="160" x2="390" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- 305 -->
    <g id="room-305" data-room="305" class="room">
      <rect x="400" y="30" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 307 -->
    <g id="room-307" data-room="307" class="room">
      <rect x="560" y="30" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 309 -->
    <g id="room-309" data-room="309" class="room">
      <rect x="720" y="30" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Сходи (праві) -->
    <g id="stairs-top-right" data-type="stairs" class="stairs">
      <rect x="880" y="30" width="100" height="170" fill="#fff3cd" stroke="#555" stroke-width="1.5"/>
      <line x1="890" y1="60" x2="970" y2="60" stroke="#999" stroke-width="1"/>
      <line x1="890" y1="80" x2="970" y2="80" stroke="#999" stroke-width="1"/>
      <line x1="890" y1="100" x2="970" y2="100" stroke="#999" stroke-width="1"/>
      <line x1="890" y1="120" x2="970" y2="120" stroke="#999" stroke-width="1"/>
      <line x1="890" y1="140" x2="970" y2="140" stroke="#999" stroke-width="1"/>
      <line x1="890" y1="160" x2="970" y2="160" stroke="#999" stroke-width="1"/>
    </g>

    <!-- WC (чоловічий) -->
    <g id="room-wc-m" data-room="wc-m" data-type="wc" class="room">
      <rect x="980" y="30" width="100" height="170" fill="#d4e6f9" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- WC (жіночий) -->
    <g id="room-wc-f" data-room="wc-f" data-type="wc" class="room">
      <rect x="1080" y="30" width="100" height="170" fill="#f9d4e6" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Зал кафе + кухня -->
    <g id="room-cafe-hall" data-room="cafe-hall" data-type="service" class="room">
      <rect x="1180" y="30" width="400" height="170" fill="#fde8d0" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- ============================================ -->
    <!-- КІМНАТИ — НИЖНІЙ РЯД                        -->
    <!-- Порядок (L→R): 300, 302, 304, [головний вхід], 306 (прохід), 308 (+кімната), 310, ЗАЛ, КАФЕ -->
    <!-- ============================================ -->

    <!-- 300 -->
    <g id="room-300" data-room="300" class="room">
      <rect x="20" y="300" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 302 -->
    <g id="room-302" data-room="302" class="room">
      <rect x="160" y="300" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 304 -->
    <g id="room-304" data-room="304" class="room">
      <rect x="320" y="300" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- Головний вхід -->
    <g id="main-entrance" data-type="entrance" class="entrance">
      <rect x="480" y="300" width="120" height="170" fill="#d0fde8" stroke="#555" stroke-width="1.5"/>
      <!-- Дверний проїзд позначення -->
      <rect x="510" y="440" width="60" height="30" fill="#4CAF50" rx="3" opacity="0.7"/>
    </g>

    <!-- 306 -->
    <g id="room-306" data-room="306" class="room">
      <rect x="600" y="300" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- 308 (з додатковою кімнатою) -->
    <g id="room-308" data-room="308" class="room">
      <rect x="740" y="300" width="160" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
      <!-- Внутрішня перегородка (додаткова кімната) -->
      <line x1="740" y1="400" x2="850" y2="400" stroke="#555" stroke-width="1" stroke-dasharray="4,3"/>
      <!-- Дверний проїзд між кімнатами -->
      <line x1="850" y1="390" x2="850" y2="410" stroke="#4CAF50" stroke-width="3"/>
    </g>
    <g id="room-308a" data-room="308a" data-parent="308" class="room sub-room">
      <rect x="740" y="400" width="110" height="70" fill="#e8f4e8" stroke="none" opacity="0.3"/>
    </g>

    <!-- 310 -->
    <g id="room-310" data-room="310" class="room">
      <rect x="900" y="300" width="140" height="170" fill="#e8f4e8" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- ЗАЛ (актова зала) -->
    <g id="room-hall" data-room="hall" data-type="service" class="room">
      <rect x="1040" y="300" width="240" height="170" fill="#fde8d0" stroke="#555" stroke-width="1.5"/>
    </g>

    <!-- КАФЕ -->
    <g id="room-cafe" data-room="cafe" data-type="service" class="room">
      <rect x="1280" y="300" width="300" height="170" fill="#fde8d0" stroke="#555" stroke-width="1.5"/>
    </g>
  </g>

  <!-- ============================================ -->
  <!-- ДВЕРНІ ПРОЇЗДИ (зазори в стінах)              -->
  <!-- Верхній ряд — двері з коридору в кімнати      -->
  <!-- ============================================ -->
  <g id="doors">
    <!-- Двері 301 -->
    <line x1="80" y1="195" x2="120" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 303 -->
    <line x1="200" y1="195" x2="240" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 305 -->
    <line x1="450" y1="195" x2="490" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 307 -->
    <line x1="610" y1="195" x2="650" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 309 -->
    <line x1="770" y1="195" x2="810" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері WC(ч) -->
    <line x1="1010" y1="195" x2="1040" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері WC(ж) -->
    <line x1="1110" y1="195" x2="1140" y2="195" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері кафе зал (зверху) -->
    <line x1="1250" y1="195" x2="1290" y2="195" stroke="#f0f4f8" stroke-width="6"/>

    <!-- Нижній ряд — двері з коридору в кімнати -->
    <!-- Двері 300 -->
    <line x1="60" y1="305" x2="100" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 302 -->
    <line x1="210" y1="305" x2="250" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 304 -->
    <line x1="370" y1="305" x2="410" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 306 -->
    <line x1="640" y1="305" x2="680" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 308 -->
    <line x1="790" y1="305" x2="830" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері 310 -->
    <line x1="940" y1="305" x2="980" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері ЗАЛ -->
    <line x1="1120" y1="305" x2="1160" y2="305" stroke="#f0f4f8" stroke-width="6"/>
    <!-- Двері КАФЕ -->
    <line x1="1380" y1="305" x2="1420" y2="305" stroke="#f0f4f8" stroke-width="6"/>
  </g>

  <!-- ============================================ -->
  <!-- СТРІЛКИ НАВІГАЦІЇ В КОРИДОРІ                  -->
  <!-- Сегментовані для підсвічування шляху          -->
  <!-- ============================================ -->
  <g id="arrows">
    <!-- Горизонтальні сегменти коридору (основна лінія руху) -->
    <!-- Сегмент 1: від 300/301 до 302/303 -->
    <path id="arrow-seg-1" data-segment="1" data-from="entrance-left" data-to="room-302"
          d="M 40,250 L 220,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>
    
    <!-- Сегмент 2: від 302/303 до сходів -->
    <path id="arrow-seg-2" data-segment="2" data-from="room-302" data-to="stairs-left"
          d="M 240,250 L 340,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 3: від сходів до 305/304 -->
    <path id="arrow-seg-3" data-segment="3" data-from="stairs-left" data-to="room-304"
          d="M 360,250 L 480,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 4: від головного входу до 306 -->
    <path id="arrow-seg-4" data-segment="4" data-from="entrance" data-to="room-306"
          d="M 520,250 L 660,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 5: від 306/307 до 308/309 -->
    <path id="arrow-seg-5" data-segment="5" data-from="room-306" data-to="room-308"
          d="M 680,250 L 820,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 6: від 308/309 до сходів праві -->
    <path id="arrow-seg-6" data-segment="6" data-from="room-308" data-to="stairs-right"
          d="M 840,250 L 930,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 7: від сходів до 310/WC -->
    <path id="arrow-seg-7" data-segment="7" data-from="stairs-right" data-to="room-310"
          d="M 950,250 L 1040,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 8: від WC до ЗАЛ/КАФЕ -->
    <path id="arrow-seg-8" data-segment="8" data-from="room-310" data-to="room-hall"
          d="M 1060,250 L 1280,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Сегмент 9: до кінця коридору (КАФЕ) -->
    <path id="arrow-seg-9" data-segment="9" data-from="room-hall" data-to="room-cafe"
          d="M 1300,250 L 1560,250" stroke="#4a90d9" stroke-width="2" opacity="0.5"
          marker-end="url(#arrowhead-right)"/>

    <!-- Вертикальні відгалуження до кімнат (верхній ряд) -->
    <path id="arrow-to-301" data-target="301" d="M 90,245 L 90,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-303" data-target="303" d="M 220,245 L 220,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-305" data-target="305" d="M 470,245 L 470,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-307" data-target="307" d="M 630,245 L 630,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-309" data-target="309" d="M 790,245 L 790,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-wc-m" data-target="wc-m" d="M 1020,245 L 1020,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>
    <path id="arrow-to-wc-f" data-target="wc-f" d="M 1120,245 L 1120,205" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-up)"/>

    <!-- Вертикальні відгалуження до кімнат (нижній ряд) -->
    <path id="arrow-to-300" data-target="300" d="M 80,255 L 80,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-302" data-target="302" d="M 230,255 L 230,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-304" data-target="304" d="M 390,255 L 390,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-306" data-target="306" d="M 660,255 L 660,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-308" data-target="308" d="M 810,255 L 810,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-310" data-target="310" d="M 960,255 L 960,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-hall" data-target="hall" d="M 1140,255 L 1140,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
    <path id="arrow-to-cafe" data-target="cafe" d="M 1400,255 L 1400,295" stroke="#4a90d9" stroke-width="1.5" opacity="0.4" marker-end="url(#arrowhead-down)"/>
  </g>
</svg>
