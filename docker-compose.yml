version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: college-virtual-map-frontend
    restart: unless-stopped
    ports:
      - "80:9002"
    # Для логування
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
