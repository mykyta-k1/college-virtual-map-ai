server {
    listen 80;
    server_name localhost;
    
    root /usr/share/nginx/html;
    index index.html;

    # Gzip стиснення для оптимізації
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied expired no-cache no-store private auth;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;
    gzip_disable "MSIE [1-6]\.";

    # Кешування статичних файлів
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Головний location для React Router (fallback на index.html)
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache";
    }

    # Проксі для AI Worker
    location /api/ai/chat {
        resolver 8.8.8.8 8.8.4.4 valid=300s;
        
        # Завжди передаємо шлях /chat на воркер, оскільки AI_WORKER_BASE_URL це базова URL
        rewrite ^/api/ai/chat/?$ /chat break;
        
        proxy_pass ${AI_WORKER_BASE_URL};
        
        proxy_set_header 'x-api-key' "${AI_API_KEY}";
        proxy_set_header Host $proxy_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        proxy_ssl_server_name on;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;
    }

    # Безпека: приховуємо версію Nginx
    server_tokens off;

    # Обробка помилок
    error_page 404 /index.html;
}
